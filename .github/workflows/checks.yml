name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Ruff
        run: uvx ruff@0.17.5 check --output-format=github .
      - name: Tracked JSON parses
        run: git ls-files -z '*.json' | xargs -0 -n1 python3 -m json.tool >/dev/null

  test:
    name: Host tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked environment
        run: uv sync --frozen --extra bo
      - name: Import every module
        run: |
          uv run python - <<'PY'
          import importlib, pkgutil, cfps_sim
          for module in pkgutil.iter_modules(cfps_sim.__path__):
              importlib.import_module(f"cfps_sim.{module.name}")
              print("ok", module.name)
          PY
      # Hosted runners have no CUDA GPU. Deselecting the gpu marker (rather than
      # letting conftest skip it) means any other skip shows up as a real skip.
      - name: Pytest (host subset)
        run: >
          uv run pytest -m "not gpu" -ra --strict-markers
          --junitxml=pytest-${{ matrix.os }}-py${{ matrix.python }}.xml
      - name: CLI smoke test
        run: bash scripts/ci_smoke.sh
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python }}
          path: pytest-*.xml
          if-no-files-found: ignore

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv build
      - name: Wheel installs and the entry point runs outside the checkout
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/cfps-sim --help

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
