name: Core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python python
      - run: uv run pytest
      - run: uv run cfps-sim validate examples/recipe.json
      - run: uv run cfps-sim simulate
      - run: uv run cfps-sim simulate --construct constructs/competition/sfgfp.json --output results/sfgfp
