[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfps-sim"
version = "0.1.0"
description = "Mechanistic CFPS starter models and constrained experiment design"
requires-python = ">=3.11,<3.13"
dependencies = ["antimony>=3", "libroadrunner>=2.8", "numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
bo = ["botorch>=0.13", "torch>=2.6"]
cloud = ["modal>=1"]
docs = ["pweave==0.30.3", "matplotlib>=3.8", "ipykernel>=6,<7", "ipython>=7.34,<8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
cfps-sim = "cfps_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cfps_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
