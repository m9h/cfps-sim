[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfps-sim"
version = "0.1.0"
description = "Mechanistic CFPS starter models and constrained experiment design"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["antimony>=3", "numpy>=1.26", "biopython>=1.85", "torch>=2.6", "torchdiffeq>=0.2.5"]

[project.optional-dependencies]
bo = ["botorch>=0.13"]
cloud = ["modal>=1"]
docs = ["pweave==0.30.3", "matplotlib>=3.8", "ipykernel>=6,<7", "ipython>=7.34,<8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
cfps-sim = "cfps_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cfps_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA numerical execution"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness only: syntax errors, undefined names, unused imports/variables.
select = ["E9", "F"]
